<h1>自动化流程</h1>
<p>通过规则自动分配任务、发送提醒并同步状态。</p>
<p>自动化流程功能已包含在所有套餐中。</p>
<p>存储容量：每个团队 50GB。</p>
<p><a href="/features.html">返回功能介绍</a></p>
<p>你可以用简单的条件规则把重复工作交给系统，例如任务状态变更时自动通知负责人。</p><p>所有自动化规则都可以在后台统一管理，也可以随时暂停或调整触发条件。</p>
<p>系统会在每个工作日早上汇总昨日进展，并把摘要发送到你指定的频道。</p><p>如果担心误触发，可以先在测试空间里试运行，确认无误后再启用到正式团队。</p>
