<h1>退款政策</h1>
<p>购买后 7 天内可申请无理由退款。</p>
<p>年付用户同样适用该政策。</p>
<p><a href="/pricing.html">价格</a></p>
<p>退款申请提交后，我们会在 3 个工作日内完成审核，款项将退回原支付渠道。</p><p>已经使用的增值服务不在退款范围内；年度套餐按未使用月份比例退款。</p><p>如需帮助，请联系客服团队，我们会协助你完成整个流程。</p>
<p>如果你是通过代理商购买的，请直接联系代理商办理退款，我们会配合提供必要的凭证。</p><p>退款完成后，团队数据会保留 30 天，期间你仍然可以导出全部内容。</p>
